<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Student Record Manager</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #273c75, transparent 35%),
        radial-gradient(circle at 80% 80%, #6c5ce7, transparent 35%),
        linear-gradient(135deg, #050816, #111827);
    color: white;
    overflow-x: hidden;
}

/* Background 3D objects */

.scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
}

.cube {
    position: absolute;
    width: 100px;
    height: 100px;
    border: 2px solid rgba(255,255,255,0.25);
    transform-style: preserve-3d;
    animation: rotateCube 12s linear infinite;
}

.cube:nth-child(1) {
    top: 10%;
    left: 8%;
}

.cube:nth-child(2) {
    bottom: 15%;
    right: 10%;
    width: 150px;
    height: 150px;
    animation-duration: 18s;
}

@keyframes rotateCube {
    from {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
    }
    to {
        transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
    }
}

.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
    animation: float 7s infinite ease-in-out;
}

.particle:nth-child(3) {
    left: 30%;
    top: 20%;
}

.particle:nth-child(4) {
    left: 70%;
    top: 30%;
}

.particle:nth-child(5) {
    left: 50%;
    top: 80%;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-40px);
    }
}

/* Main container */

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
    padding: 35px 0;
}

/* Header */

header {
    text-align: center;
    margin-bottom: 35px;
}

header h1 {
    font-size: 42px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(120,120,255,0.8);
}

header p {
    color: #cbd5e1;
    font-size: 17px;
}

/* Cards */

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    padding: 28px;
    margin-bottom: 25px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.35),
        inset 0 0 30px rgba(255,255,255,0.03);

    transition: 0.4s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow:
        0 25px 60px rgba(0,0,0,0.45),
        0 0 30px rgba(99,102,241,0.15);
}

.card h2 {
    margin-bottom: 20px;
    font-size: 25px;
}

/* Form */

.form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.input-group {
    display: flex;
    flex-direction: column;
}

.input-group label {
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 14px;
}

.input-group input {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    outline: none;

    background: rgba(0,0,0,0.25);
    color: white;

    transition: 0.3s;
}

.input-group input:focus {
    border-color: #818cf8;
    box-shadow: 0 0 15px rgba(99,102,241,0.4);
}

/* Buttons */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 22px;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 12px;
    cursor: pointer;

    color: white;
    font-weight: bold;

    background: linear-gradient(135deg, #6366f1, #8b5cf6);

    box-shadow: 0 8px 20px rgba(99,102,241,0.3);

    transition: 0.3s;
}

button:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 25px rgba(99,102,241,0.5);
}

button:active {
    transform: scale(0.97);
}

.download {
    background: linear-gradient(135deg, #059669, #10b981);
}

.clear {
    background: linear-gradient(135deg, #dc2626, #ef4444);
}

.delete-btn {
    background: linear-gradient(135deg, #b91c1c, #ef4444);
    padding: 8px 13px;
    font-size: 12px;
}

/* Message */

#message {
    margin-top: 18px;
    padding: 12px;
    border-radius: 10px;
    display: none;
    font-weight: bold;
}

.success {
    display: block !important;
    background: rgba(16,185,129,0.15);
    border: 1px solid #10b981;
    color: #6ee7b7;
}

.error {
    display: block !important;
    background: rgba(239,68,68,0.15);
    border: 1px solid #ef4444;
    color: #fca5a5;
}

/* Statistics */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    padding: 22px;
    text-align: center;

    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.1);

    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.stat h3 {
    font-size: 32px;
    margin-bottom: 5px;
}

.stat p {
    color: #cbd5e1;
}

/* Table */

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th,
td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

th {
    background: rgba(99,102,241,0.2);
}

td {
    color: #e2e8f0;
}

tr:hover {
    background: rgba(255,255,255,0.05);
}

/* Empty message */

.empty {
    text-align: center;
    padding: 30px;
    color: #94a3b8;
}

/* Footer */

footer {
    text-align: center;
    margin-top: 30px;
    padding: 20px;
    color: #94a3b8;
}

/* Mobile */

@media(max-width: 800px) {

    header h1 {
        font-size: 30px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .container {
        width: 94%;
    }
}
</style>
</head>

<body>

<!-- 3D Background -->

<div class="scene">

    <div class="cube"></div>
    <div class="cube"></div>

    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

</div>

<div class="container">

<header>

    <h1>🎓 3D Student Record Manager</h1>

    <p>
        Add, validate, save and manage student records
    </p>

</header>


<!-- Statistics -->

<div class="stats">

    <div class="stat">
        <h3 id="totalStudents">0</h3>
        <p>Total Students</p>
    </div>

    <div class="stat">
        <h3 id="validRecords">0</h3>
        <p>Valid Records</p>
    </div>

    <div class="stat">
        <h3 id="storageStatus">ON</h3>
        <p>Local Storage</p>
    </div>

</div>


<!-- Add Student -->

<div class="card">

    <h2>➕ Add Student</h2>

    <div class="form-grid">

        <div class="input-group">

            <label for="studentName">
                Student Name
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >

        </div>


        <div class="input-group">

            <label for="rollNumber">
                Roll Number
            </label>

            <input
                type="text"
                id="rollNumber"
                placeholder="Enter roll number"
            >

        </div>


        <div class="input-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
            >

        </div>

    </div>


    <div class="buttons">

        <button onclick="addStudent()">
            ➕ Add Student
        </button>

        <button onclick="readStudents()">
            📋 Read Student Data
        </button>

        <button class="download" onclick="downloadData()">
            💾 Save Data to File
        </button>

        <button class="clear" onclick="clearAllData()">
            🗑 Clear All
        </button>

    </div>


    <div id="message"></div>

</div>


<!-- Student Records -->

<div class="card">

    <h2>📚 Student Records</h2>

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>#</th>
                    <th>Name</th>
                    <th>Roll Number</th>
                    <th>Email</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>


<footer>

    Student Record Manager | HTML + CSS + JavaScript

</footer>

</div>


<script>

/*
====================================================
STUDENT RECORD MANAGER
====================================================
*/

// Storage key

const STORAGE_KEY = "studentRecords";


// Get students from localStorage

function getStudents() {

    try {

        const data = localStorage.getItem(STORAGE_KEY);

        if (!data) {
            return [];
        }

        return JSON.parse(data);

    }

    catch (error) {

        showMessage(
            "Error reading student data.",
            "error"
        );

        return [];

    }

}


// Save students to localStorage

function saveStudents(students) {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(students)
        );

        return true;

    }

    catch (error) {

        showMessage(
            "Unable to save student data.",
            "error"
        );

        return false;

    }

}


// Email validation using Regex

function validateEmail(email) {

    const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    return emailRegex.test(email);

}


// Add Student

function addStudent() {

    try {

        const name =
            document.getElementById("studentName")
            .value.trim();

        const roll =
            document.getElementById("rollNumber")
            .value.trim();

        const email =
            document.getElementById("email")
            .value.trim();


        // Validate empty fields

        if (!name || !roll || !email) {

            throw new Error(
                "Please fill all fields."
            );

        }


        // Validate name

        if (name.length < 2) {

            throw new Error(
                "Student name must contain at least 2 characters."
            );

        }


        // Validate email

        if (!validateEmail(email)) {

            throw new Error(
                "Please enter a valid email address."
            );

        }


        const students = getStudents();


        // Check duplicate roll number

        const duplicate =
            students.some(
                student =>
                    student.roll.toLowerCase() ===
                    roll.toLowerCase()
            );


        if (duplicate) {

            throw new Error(
                "This roll number already exists."
            );

        }


        // Create student object

        const student = {

            id: Date.now(),

            name: name,

            roll: roll,

            email: email

        };


        // Add student

        students.push(student);


        // Save

        const saved = saveStudents(students);


        if (!saved) {

            throw new Error(
                "Student could not be saved."
            );

        }


        // Clear inputs

        document.getElementById("studentName").value = "";

        document.getElementById("rollNumber").value = "";

        document.getElementById("email").value = "";


        // Display success

        showMessage(
            "✅ Student added successfully!",
            "success"
        );


        // Refresh table

        readStudents();

    }

    catch (error) {

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}


// Read Student Data

function readStudents() {

    try {

        const students = getStudents();

        const table =
            document.getElementById("studentTable");


        table.innerHTML = "";


        if (students.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        No student records found.
                    </td>
                </tr>
            `;

        }

        else {

            students.forEach(
                (student, index) => {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `

                        <td>${index + 1}</td>

                        <td>${escapeHTML(student.name)}</td>

                        <td>${escapeHTML(student.roll)}</td>

                        <td>${escapeHTML(student.email)}</td>

                        <td>
                            <button
                                class="delete-btn"
                                onclick="deleteStudent(${student.id})"
                            >
                                Delete
                            </button>
                        </td>

                    `;

                    table.appendChild(row);

                }
            );

        }


        updateStatistics(students);

    }

    catch (error) {

        showMessage(
            "❌ Unable to read student records.",
            "error"
        );

    }

}


// Delete Student

function deleteStudent(id) {

    try {

        let students = getStudents();


        const studentExists =
            students.some(
                student => student.id === id
            );


        if (!studentExists) {

            throw new Error(
                "Student record not found."
            );

        }


        students =
            students.filter(
                student => student.id !== id
            );


        saveStudents(students);


        showMessage(
            "🗑 Student deleted successfully.",
            "success"
        );


        readStudents();

    }

    catch (error) {

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}


// Download data as JSON file

function downloadData() {

    try {

        const students = getStudents();


        if (students.length === 0) {

            throw new Error(
                "There are no student records to save."
            );

        }


        const jsonData =
            JSON.stringify(
                students,
                null,
                4
            );


        const blob =
            new Blob(
                [jsonData],
                {
                    type: "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "student_records.json";


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        URL.revokeObjectURL(url);


        showMessage(
            "💾 Student data downloaded successfully!",
            "success"
        );

    }

    catch (error) {

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}


// Clear all data

function clearAllData() {

    try {

        const students = getStudents();


        if (students.length === 0) {

            throw new Error(
                "No student records available."
            );

        }


        const confirmation =
            confirm(
                "Are you sure you want to delete all student records?"
            );


        if (!confirmation) {

            return;

        }


        localStorage.removeItem(
            STORAGE_KEY
        );


        showMessage(
            "🗑 All student records deleted.",
            "success"
        );


        readStudents();

    }

    catch (error) {

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}


// Display message

function showMessage(message, type) {

    const messageBox =
        document.getElementById("message");


    messageBox.textContent = message;

    messageBox.className = type;


    setTimeout(
        () => {

            messageBox.className = "";

            messageBox.textContent = "";

        },
        3500
    );

}


// Update statistics

function updateStatistics(students) {

    document.getElementById(
        "totalStudents"
    ).textContent = students.length;


    document.getElementById(
        "validRecords"
    ).textContent = students.length;

}


// Prevent HTML injection

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent = value;

    return div.innerHTML;

}


// Load data when page opens

window.onload = function() {

    readStudents();

};

</script>

</body>
</html>
